name: Release

on:
  push:
    tags:
      # Only immutable release tags publish artifacts. Floating Action tags
      # such as v1 are advanced after publication and must not re-run GoReleaser.
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Publishing uses the release bot App token. The job token only needs an
    # OIDC token for keyless cosign signing and build provenance, plus
    # attestations: write to record that provenance.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Mint release bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # GoReleaser skips notarization when any MACOS_* secret is unset, and the
      # release would then ship darwin binaries that Gatekeeper refuses. Fail
      # before publishing instead.
      - name: Verify the macOS signing credentials
        shell: bash
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail

          missing=()
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=macOS signing::Missing ${missing[*]}. Notarization would be skipped and the darwin binaries would ship unsigned."
            exit 1
          fi

          echo "macOS signing credentials present."
      - name: Extract this release's notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # The GitHub release body should BE the release-please-written notes
        # for this version (including the Migration Notes / Operator Notes
        # sections), not just a link to CHANGELOG.md. release-please writes
        # exactly one "## [x.y.z](...)" heading per release; take everything
        # from that heading (exclusive — the release title already names the
        # version) to the next release heading. Missing section degrades to
        # the link-only body rather than failing the release: publishing
        # artifacts must never be blocked by notes formatting.
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v ver="${version}" '
            !found && index($0, "## [" ver "]") == 1 { found=1; flag=1; next }
            flag && /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "::warning::no CHANGELOG.md section found for ${version}; publishing with link-only release notes"
            : > /tmp/release-notes.md
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Presence is enforced by the step above; the notarize block's own
          # skip only guards local and snapshot builds.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest release metadata artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.sbom.json
            dist/*.sigstore.json
      - name: Advance floating major Action tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "release tag must be a stable semantic version (got ${RELEASE_TAG})" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          major_tag="v${major}"

          # A manual rerun of an older release must never roll the floating
          # major tag backward. Move it only when this is the newest immutable
          # stable tag in the major line.
          git fetch --force --tags origin
          latest=""
          while IFS= read -r candidate; do
            if [[ "${candidate}" =~ ^v${major}\.[0-9]+\.[0-9]+$ ]]; then
              latest="${candidate}"
              break
            fi
          done < <(git tag --list "${major_tag}.*.*" --sort=-version:refname)

          if [ "${latest}" != "${RELEASE_TAG}" ]; then
            echo "${RELEASE_TAG} is not the latest ${major_tag} release (${latest}); leaving ${major_tag} unchanged."
            exit 0
          fi

          release_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          git config user.name "skaphos-release-bot[bot]"
          git config user.email "261675299+skaphos-release-bot[bot]@users.noreply.github.com"
          git tag --force --annotate "${major_tag}" "${release_commit}" --message "${major_tag}"
          git push --force origin "refs/tags/${major_tag}"
          echo "Advanced ${major_tag} to ${RELEASE_TAG} (${release_commit})."
