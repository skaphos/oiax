name: Release

on:
  push:
    tags:
      # Only immutable release tags publish artifacts. Floating Action tags
      # such as v1 are advanced after publication and must not re-run GoReleaser.
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Mint release bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Extract this release's notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # The GitHub release body should BE the release-please-written notes
        # for this version (including the Migration Notes / Operator Notes
        # sections), not just a link to CHANGELOG.md. release-please writes
        # exactly one "## [x.y.z](...)" heading per release; take everything
        # from that heading (exclusive — the release title already names the
        # version) to the next level-2 heading. Stop at ANY "## " heading, not
        # only "## [": the first release's heading is "## 1.0.0 (...)" with no
        # link, and a bracket-only stop let v1.0.1's section run into it.
        # Missing section degrades to the link-only body rather than failing
        # the release: publishing artifacts must never be blocked by notes
        # formatting.
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v ver="${version}" '
            !found && index($0, "## [" ver "]") == 1 { found=1; flag=1; next }
            flag && /^## / { flag=0 }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "::warning::no CHANGELOG.md section found for ${version}; publishing with link-only release notes"
            : > /tmp/release-notes.md
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Advance floating major Action tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "release tag must be a stable semantic version (got ${RELEASE_TAG})" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          major_tag="v${major}"

          # A manual rerun of an older release must never roll the floating
          # major tag backward. Move it only when this is the newest immutable
          # stable tag in the major line.
          git fetch --force --tags origin
          latest=""
          while IFS= read -r candidate; do
            if [[ "${candidate}" =~ ^v${major}\.[0-9]+\.[0-9]+$ ]]; then
              latest="${candidate}"
              break
            fi
          done < <(git tag --list "${major_tag}.*.*" --sort=-version:refname)

          if [ "${latest}" != "${RELEASE_TAG}" ]; then
            echo "${RELEASE_TAG} is not the latest ${major_tag} release (${latest}); leaving ${major_tag} unchanged."
            exit 0
          fi

          release_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          git config user.name "skaphos-release-bot[bot]"
          git config user.email "261675299+skaphos-release-bot[bot]@users.noreply.github.com"
          git tag --force --annotate "${major_tag}" "${release_commit}" --message "${major_tag}"
          git push --force origin "refs/tags/${major_tag}"
          echo "Advanced ${major_tag} to ${RELEASE_TAG} (${release_commit})."
      # Check the published release itself rather than trusting the publishing
      # step. Every release through v2.1.2 went out with a footer-only body and
      # the run stayed green (#144). This runs after the floating tag moves:
      # notes can be fixed after publication, and a notes problem must not hold
      # Action users on the previous release.
      - name: Verify the published release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          failed=0

          assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name')"
          for name in checksums.txt \
            "oiax_${version}_linux_amd64.tar.gz" "oiax_${version}_linux_arm64.tar.gz" \
            "oiax_${version}_darwin_amd64.tar.gz" "oiax_${version}_darwin_arm64.tar.gz" \
            "oiax_${version}_windows_amd64.zip" "oiax_${version}_windows_arm64.zip"; do
            if ! grep -Fxq "${name}" <<<"${assets}"; then
              echo "::error title=Release assets::${RELEASE_TAG} is missing ${name}"
              failed=1
            fi
          done

          # Every entry line of this version's CHANGELOG.md section must appear
          # in the published body. Section headings ("### Bug Fixes") are generic
          # and would also match another release's notes, so check the entries;
          # each one names a specific change and commit. A section with no entry
          # lines falls back to its first non-blank line.
          if grep -q '[^[:space:]]' /tmp/release-notes.md; then
            body="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json body --jq .body)"
            mapfile -t entries < <(grep -E '^[*-] ' /tmp/release-notes.md || true)
            if [ "${#entries[@]}" -eq 0 ]; then
              mapfile -t entries < <(grep -m1 '[^[:space:]]' /tmp/release-notes.md)
            fi
            missing_notes=0
            for entry in "${entries[@]}"; do
              if ! grep -Fq -- "${entry}" <<<"${body}"; then
                missing_notes=$((missing_notes + 1))
              fi
            done
            if [ "${missing_notes}" -ne 0 ]; then
              echo "::error title=Release notes::${RELEASE_TAG} is missing ${missing_notes} of ${#entries[@]} CHANGELOG.md entries. Edit the release body; title and notes stay editable even on an immutable release."
              failed=1
            fi
          fi

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "${RELEASE_TAG}: all assets present and release notes published."
