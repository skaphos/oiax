version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - misspell
    - depguard
  settings:
    errcheck:
      # Human-facing terminal writes; machine-readable output (JSON
      # plans) must still check its writes explicitly.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    depguard:
      rules:
        # The engine's purity rules are structural: observation happens
        # before planning, application after. The planner must never be
        # able to reach the git layer or a forge provider.
        engine-purity:
          list-mode: lax
          files:
            - "**/internal/engine/**"
          deny:
            - pkg: "github.com/skaphos/oiax/internal/git"
              desc: "engine must not call git; branch state is injected as observed EdgeState"
            - pkg: "github.com/skaphos/oiax/internal/forge"
              desc: "engine must not call forge providers; requests are injected as observed state"

        notification-purity:
          list-mode: lax
          files:
            - "**/internal/notification/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/skaphos/oiax/internal/git"
              desc: "notification state is pure; inject Git observations"
            - pkg: "github.com/skaphos/oiax/internal/forge"
              desc: "notification state is pure; inject lifecycle facts"
            - pkg: "github.com/skaphos/oiax/internal/notification/"
              desc: "notification effects and fixtures must not enter the pure model"
            - pkg: "net$"
              desc: "network effects belong in notification/delivery"
            - pkg: "net/http"
              desc: "HTTP effects belong in notification/delivery; pure net/url parsing is allowed"
            - pkg: "net/rpc"
              desc: "network effects belong in notification/delivery"
            - pkg: "net/smtp"
              desc: "network effects belong in notification/delivery"
            - pkg: "os"
              desc: "inject configuration and operation IDs; no environment or process access"
            - pkg: "syscall"
              desc: "system effects belong outside the pure notification package"

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
